<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Get Random</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* Layout: a mustard "sun band" opens each section (the Curioster heritage), working surfaces sit on warm paper below; the week is always a 7-box grid. */
:root{
  --sun:#F2C94C; --sun-deep:#E3B330; --on-sun:#23303D;
  --paper:#FBF4E2; --card:#FFFCF3; --sunk:#F3E8CA;
  --ink:#23303D; --ink-2:#56606A; --line:#E2D2A6;
  --terra:#A54E2E; --on-terra:#FFF8EA; --terra-soft:#F4DCCB;
  --navy:#2F4356; --on-navy:#F6EBCF;
  --good:#3E7350; --warn:#9A6A10; --bad:#A33A2E;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --r-lg:16px;
  --d-senses:#C0662F; --d-explore:#2F7C80; --d-learn:#2F4356; --d-create:#B4417A; --d-connect:#B8860B;
  --d-move:#3E7350; --d-reflect:#6A5394; --d-give:#B5482F; --d-awe:#356C9E; --d-play:#8A6D1C;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sun:#E8BC3A; --sun-deep:#D3A522; --on-sun:#1D2732;
  --paper:#141C25; --card:#1C2733; --sunk:#111821;
  --ink:#F3E9D0; --ink-2:#B8B09C; --line:#304050;
  --terra:#EE9670; --on-terra:#1C120B; --terra-soft:#3A2A22;
  --navy:#A9C1D8; --on-navy:#141C25;
  --good:#7DC497; --warn:#E5B85A; --bad:#F08A7C;
  --d-senses:#F09A63; --d-explore:#6CC3C5; --d-learn:#A9C1D8; --d-create:#EA87B8; --d-connect:#E8BC3A;
  --d-move:#86C99A; --d-reflect:#B8A3E6; --d-give:#F0927B; --d-awe:#8DB8E6; --d-play:#D9BE6A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --sun:#E8BC3A; --sun-deep:#D3A522; --on-sun:#1D2732;
  --paper:#141C25; --card:#1C2733; --sunk:#111821;
  --ink:#F3E9D0; --ink-2:#B8B09C; --line:#304050;
  --terra:#EE9670; --on-terra:#1C120B; --terra-soft:#3A2A22;
  --navy:#A9C1D8; --on-navy:#141C25;
  --good:#7DC497; --warn:#E5B85A; --bad:#F08A7C;
  --d-senses:#F09A63; --d-explore:#6CC3C5; --d-learn:#A9C1D8; --d-create:#EA87B8; --d-connect:#E8BC3A;
  --d-move:#86C99A; --d-reflect:#B8A3E6; --d-give:#F0927B; --d-awe:#8DB8E6; --d-play:#D9BE6A;
  color-scheme:dark }
html.ts-1{font-size:100%} html.ts-2{font-size:112.5%} html.ts-3{font-size:125%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sun)}
*{box-sizing:border-box}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:.005em}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.band .eyebrow{color:var(--on-sun);opacity:.8}
.muted{color:var(--ink-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sun);color:var(--on-sun);border-bottom:2px solid var(--on-sun)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto}
.brand svg{width:38px;height:38px;flex:none}
.wordmark{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.01em;line-height:1}
.status{font-family:var(--mono);font-size:.72rem;display:flex;align-items:center;gap:6px;padding:4px 8px;border:1.5px solid var(--on-sun);border-radius:999px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--on-sun);display:inline-block}
.status.cloud i{background:#2E6B45}
.ts{display:flex;border:1.5px solid var(--on-sun);border-radius:999px;overflow:hidden}
.ts button{background:none;border:0;padding:3px 9px;cursor:pointer;color:var(--on-sun);font-weight:700}
.ts button[aria-pressed="true"]{background:var(--on-sun);color:var(--sun)}
.nav{overflow-x:auto;scrollbar-width:none;border-top:1.5px solid rgba(35,48,61,.25)}
.nav::-webkit-scrollbar{display:none}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:2px}
.nav a{display:block;padding:9px 12px;font-family:var(--display);font-weight:700;font-size:1.08rem;color:var(--on-sun);text-decoration:none;white-space:nowrap;border-bottom:4px solid transparent;letter-spacing:.01em}
.nav a[aria-current="page"]{border-bottom-color:var(--on-sun)}
.nav a:hover{background:rgba(35,48,61,.08)}

/* sun band */
.band{background:var(--sun);color:var(--on-sun)}
.band-in{padding-block:28px 26px;display:grid;gap:18px}
.band h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:800;letter-spacing:-.01em}
.band .lede{max-width:62ch;font-size:1.05rem}
.band .rule{width:72px;height:3px;background:var(--on-sun);border:0;margin:0}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.92rem;line-height:1.1;text-decoration:none}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:var(--on-terra)}
.btn.primary:hover{filter:brightness(1.07)}
.band .btn{border-color:var(--on-sun);color:var(--on-sun)}
.band .btn:hover{background:rgba(35,48,61,.1)}
.band .btn.primary{background:var(--on-sun);color:var(--sun);border-color:var(--on-sun)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.ibtn:hover{border-color:var(--line);color:var(--ink);background:var(--sunk)}
.ibtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ibtn svg{width:17px;height:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1.5px solid currentColor;border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.86rem;color:inherit}
.seg button[aria-pressed="true"]{background:var(--on-sun);color:var(--sun)}
.dial{display:grid;gap:6px}
.dial > span{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.dials{display:flex;gap:18px 26px;flex-wrap:wrap;align-items:end}
.chipbtn{border:1.5px solid currentColor;background:none;border-radius:999px;padding:5px 11px;font-weight:700;font-size:.84rem;cursor:pointer;color:inherit}
.chipbtn[aria-pressed="true"]{background:var(--on-sun);color:var(--sun)}
input[type=text],input[type=search],input[type=date],textarea,select{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
textarea{resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
label.f{display:grid;gap:5px;font-size:.86rem;font-weight:700}

/* domain chip */
.dchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dc,var(--ink-2));font-weight:500}
.dchip svg{width:12px;height:12px;flex:none}
.dchip .min{color:var(--ink-2);text-transform:none;letter-spacing:0}

/* COMPASS */
.compass-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;padding-block:26px 40px;align-items:start}
.days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.day{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px;position:relative;min-width:0}
.day.is-today{border-color:var(--ink);box-shadow:0 0 0 2px var(--sun)}
.day.is-done{background:var(--sunk)}
.day.is-done h3{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--terra)}
.day-h{display:flex;align-items:baseline;gap:8px}
.dname{font-family:var(--display);font-weight:800;font-size:1.35rem;text-transform:uppercase;letter-spacing:.01em}
.ddate{font-family:var(--mono);font-size:.74rem;color:var(--ink-2)}
.pill{margin-left:auto;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--paper);padding:2px 7px;border-radius:999px}
.day h3{font-family:var(--body);font-weight:700;font-size:1.06rem;line-height:1.35}
.twist{font-size:.88rem;color:var(--terra);font-weight:700}
.twist b{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.cue{font-size:.86rem;color:var(--ink-2)}
.why summary{cursor:pointer;font-size:.84rem;font-weight:700;color:var(--ink-2);list-style:none;display:inline-flex;gap:6px;align-items:center}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"+";font-family:var(--mono)}
.why[open] summary::before{content:"–"}
.why p{font-size:.86rem;margin-top:6px;padding-left:10px;border-left:2px solid var(--sun)}
.day-actions{display:flex;gap:2px;margin-top:auto;padding-top:4px;border-top:1px dashed var(--line);flex-wrap:wrap}
.day-more{font-size:.8rem;color:var(--ink-2)}
.empty-day{color:var(--ink-2);font-size:.92rem}
.meters{display:grid;gap:14px;position:sticky;top:120px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;display:grid;gap:10px;min-width:0}
.panel h2{font-size:1.4rem;font-weight:800}
.bar{display:grid;grid-template-columns:96px 1fr 26px;gap:8px;align-items:center;font-size:.86rem}
.bar .track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--terra);border-radius:99px}
.bigstat{display:flex;align-items:baseline;gap:8px}
.bigstat b{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1}
.glyphrow{display:flex;flex-wrap:wrap;gap:6px}
.glyphrow span{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dc)}
.glyphrow span.off{opacity:.35}
.glyphrow svg{width:10px;height:10px}

/* TOOLBOX */
.tb{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;padding-block:22px 40px;align-items:start}
.tb-side{display:grid;gap:16px;min-width:0}
.weeklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.wk{border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--card);display:grid;gap:4px}
.wk.on{border-color:var(--ink);background:var(--sunk)}
.wk-top{display:flex;gap:6px;align-items:center}
.wk-name{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere;background:none;border:0;text-align:left;cursor:pointer;padding:0}
.wk small{font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.board-h{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.board-h h2{font-size:2rem;font-weight:800}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.col{background:var(--sunk);border:1.5px dashed var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:7px;min-height:150px;min-width:0}
.col.over,.tray.over{border-color:var(--terra);border-style:solid;background:var(--terra-soft)}
.col-h{display:flex;justify-content:space-between;align-items:baseline}
.col-h b{font-family:var(--display);font-size:1.2rem;font-weight:800;text-transform:uppercase}
.col-h span{font-family:var(--mono);font-size:.7rem;color:var(--ink-2)}
.ev{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--dc,var(--line));border-radius:8px;padding:7px 7px 6px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 6px;font-size:.88rem;position:relative}
.ev.done .ev-title{text-decoration:line-through}
.ev .grip{grid-row:span 2;cursor:grab;touch-action:none;border:0;background:none;padding:2px;color:var(--ink-2);border-radius:5px;align-self:start}
.ev .grip svg{width:14px;height:18px}
.ev-title{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ev-tools{grid-column:2;display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.ev-tools .ibtn{width:28px;height:28px}
.ev-tools .ibtn svg{width:14px;height:14px}
.ev-tools select{font-size:.75rem;padding:2px 4px;max-width:92px}
.ev-edit{grid-column:1/-1;display:grid;gap:6px}
.addline{display:flex;gap:4px}
.addline input{flex:1;min-width:0;width:100%;font-size:.84rem;padding:5px 7px}
.tray{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:7px;min-height:120px}
.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;transform:rotate(-2deg);box-shadow:0 10px 30px rgba(0,0,0,.25);width:220px}
.dropmark{height:4px;background:var(--terra);border-radius:4px}
.sharebox{display:grid;gap:8px}
.sharebox textarea{font-family:var(--mono);font-size:.75rem;height:110px}

/* HAPPENINGS */
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-block:22px 10px}
.reel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;display:grid;gap:8px;min-width:0}
.reel.locked{border-color:var(--ink);background:var(--sunk)}
.reel-h{display:flex;align-items:center;justify-content:space-between;gap:4px}
.reel-v{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1;min-height:3.2rem;overflow-wrap:anywhere}
.reel-v.spin{animation:flick .09s steps(2) infinite}
@keyframes flick{50%{opacity:.35;transform:translateY(-2px)}}
.hap-title{font-size:clamp(2rem,5vw,3.2rem);font-weight:800}
.combo{font-family:var(--mono);font-size:.8rem}
.hap-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:6px 30px}
.riff{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r-lg);padding:16px;display:grid;gap:8px;margin-bottom:24px}
.riff ol{margin:0;padding-left:1.2rem;display:grid;gap:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;min-width:0}
.item h4{font-family:var(--body);font-size:1rem;font-weight:700;overflow-wrap:anywhere}
.item p{font-size:.88rem;overflow-wrap:anywhere}
.item .row{gap:4px}
.tag{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink-2)}
.tag.ex{border-color:var(--terra);color:var(--terra)}

/* DIARY */
.diary{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;padding-block:22px 40px;align-items:start}
.composer{display:grid;gap:12px}
.composer textarea{min-height:220px;font-size:1.02rem}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale label{cursor:pointer}
.scale input{position:absolute;opacity:0;width:1px;height:1px}
.scale span{display:inline-grid;place-items:center;min-width:40px;height:34px;padding:0 8px;border:1.5px solid var(--line);border-radius:8px;font-weight:700;font-size:.86rem;background:var(--card)}
.scale input:checked + span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scale input:focus-visible + span{outline:3px solid var(--terra);outline-offset:2px}
.promptcard{background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:.92rem;display:flex;gap:10px;align-items:start}
.promptcard p{flex:1}
.entry{border-top:1.5px solid var(--line);padding-block:12px;display:grid;gap:6px}
.entry-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.entry-h b{font-family:var(--display);font-size:1.25rem;font-weight:800}
.entry-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.spark svg{width:100%;height:60px;display:block}

/* LIBRARY */
.searchbar{display:flex;gap:8px;flex-wrap:wrap}
.searchbar input{flex:1;min-width:200px;font-size:1.1rem;padding:12px 14px;border:2px solid var(--on-sun);background:#FFFCF3;color:#23303D;border-radius:999px}
.lib{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;padding-block:22px 40px;align-items:start}
.tree{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tree ul{list-style:none;margin:0;padding-left:14px;display:grid;gap:2px}
.fbtn{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;cursor:pointer;font-weight:700;font-size:.92rem}
.fbtn:hover{background:var(--sunk)}
.fbtn[aria-current="true"]{background:var(--ink);color:var(--paper)}
.fbtn svg{width:15px;height:15px;flex:none}
.fbtn .n{margin-left:auto;font-family:var(--mono);font-size:.7rem;opacity:.7}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-block:6px 12px}
.sec-h h2{font-size:1.7rem;font-weight:800}
.note-ed{display:grid;gap:8px;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r-lg);padding:14px;margin-bottom:16px}
.note-ed textarea{min-height:160px}

/* COMMONS + SCIENCE */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding-block:22px 40px;align-items:start}
.theory{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding-block:22px 10px}
.theory article{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;display:grid;gap:8px;align-content:start}
.theory h3{font-size:1.55rem;font-weight:800}
.theory .who{font-family:var(--mono);font-size:.74rem;color:var(--ink-2)}
.theory .in{font-size:.86rem;border-top:1px dashed var(--line);padding-top:8px}
.method{max-width:70ch;display:grid;gap:12px;padding-block:10px 40px}
.method h2{font-size:2rem;font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:200;max-width:calc(100% - 32px)}
.notice{background:var(--terra-soft);border-radius:var(--r);padding:10px 12px;font-size:.9rem}

/* language menu */
.lang{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--on-sun);background:transparent;color:var(--on-sun);border-radius:999px;padding:4px 10px 4px 6px;font-weight:700;cursor:pointer;font-size:.9rem;line-height:1.2}
.lang-btn:hover{background:rgba(35,48,61,.09)}
.lang-btn .globe{width:17px;height:17px}
.lang-btn .chev{width:11px;height:11px;transition:transform .22s cubic-bezier(.2,.9,.25,1)}
.lang.open .lang-btn .chev{transform:rotate(180deg)}
.lang-btn .code{font-family:var(--mono);font-size:.7rem;background:var(--on-sun);color:var(--sun);padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.lang-pop{position:absolute;right:0;top:calc(100% + 10px);z-index:40;width:264px;max-width:calc(100vw - 32px);background:var(--card);color:var(--ink);border:2px solid var(--on-sun);border-radius:16px;padding:8px 6px 6px;box-shadow:0 22px 44px -18px rgba(20,28,37,.45);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transform-origin:top right;transition:opacity .16s ease,transform .24s cubic-bezier(.2,.9,.25,1.12),visibility 0s linear .24s}
.lang.open .lang-pop{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.lang-head{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);padding:2px 10px 8px;margin:0;display:flex;align-items:center;gap:6px}
.lang-head svg{width:13px;height:13px}
.lang-list{list-style:none;margin:0;padding:0;position:relative;outline:none;border-radius:10px}
.lang-list:focus-visible{box-shadow:0 0 0 3px var(--terra)}
.lang-ind{position:absolute;left:0;right:0;top:0;height:0;border-radius:10px;background:var(--sunk);z-index:0;transition:transform .22s cubic-bezier(.2,.9,.25,1),height .22s cubic-bezier(.2,.9,.25,1),opacity .15s;pointer-events:none}
.lang-list li{position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;opacity:0;transform:translateY(-5px);transition:opacity .2s ease,transform .24s cubic-bezier(.2,.9,.25,1);transition-delay:calc(var(--i) * 24ms)}
.lang.open .lang-list li{opacity:1;transform:none}
.lang-list .lc{font-family:var(--mono);font-size:.68rem;border:1.5px solid var(--line);border-radius:5px;padding:2px 5px;color:var(--ink-2);min-width:30px;text-align:center;transition:background .2s,color .2s,border-color .2s}
.lang-list li[aria-selected="true"] .lc{background:var(--terra);border-color:var(--terra);color:var(--on-terra)}
.lang-list .ln{display:grid;line-height:1.15;min-width:0}
.lang-list .ln b{font-family:var(--display);font-size:1.3rem;font-weight:700}
.lang-list .ln small{font-size:.76rem;color:var(--ink-2)}
.lang-list .ck{width:16px;height:16px;color:var(--terra);opacity:0;transform:scale(.5) rotate(-20deg);transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.25,1.3)}
.lang-list li[aria-selected="true"] .ck{opacity:1;transform:none}
main{transition:opacity .15s ease,transform .2s ease}
main.fade{opacity:0;transform:translateY(4px)}
@media (max-width:620px){.lang-btn .name{display:none}}
@media (prefers-reduced-motion:reduce){.lang-pop,.lang-list li,.lang-ind,main{transition:none!important}}

sci_eyebrow:'Perché funziona',sci_h1:'Il caso, con metodo.',sci_lede:'Get Random sembra un gioco, ma ogni meccanismo viene dalla scienza della motivazione e dalla psicologia cognitiva. Ecco su cosa si basa ogni parte.',in_app:'Nell’app:',method_h:'Come nasce una settimana',
m1_t:'Piano degli ambiti.',m1_b:'Si estraggono sette ambiti su dieci, favorendo quelli che hai usato meno (la varietà rallenta l’adattamento edonico) e quelli legati al bisogno che hai scelto.',
m2_t:'Sintesi delle scintille.',m2_b:'Ogni ambito ha modelli con spazi aperti (un paese, un genere musicale, un colore, un’abilità, una domanda…) e una variante facoltativa. Questa grammatica produce {n} scintille diverse, senza contare le carte jolly di Claude.',
m3_t:'Su misura per te.',m3_b:'Energia, compagnia e tempo ripesano i modelli perché la sfida resti nella tua zona ideale: né noiosa né eccessiva.',
m4_t:'Registro delle novità.',m4_b:'Ogni scintilla ha un’impronta. Le nuove settimane scartano le impronte che hai già visto, così la bussola punta sempre altrove.',
m5_t:'Passare all’azione.',m5_b:'Ogni scintilla porta con sé un «quando» (un’intenzione di implementazione) e il Diario chiude il cerchio con la riflessione.',
m6_t:'Sei lingue.',m6_b:'Le scintille sono salvate come ricette e non come frasi: cambiando lingua, settimana, vassoio e happening si riscrivono all’istante.',
disclaimer:'Get Random è uno strumento di benessere e curiosità, non una terapia né un consiglio medico. Se stai attraversando un momento difficile, rivolgiti a una persona di fiducia o a un servizio di supporto della tua zona.',
cl_rate:'Claude ha bisogno di una pausa. Riprova tra un minuto.',cl_off:'Le idee di Claude sono disattivate per questa pagina.',cl_fail:'Claude non è riuscito a rispondere. Il generatore integrato funziona comunque.',
seed_note1_title:'Come funziona l’Archivio',seed_note1_body:'Tutto ciò che salvi finisce qui: scintille dalla ricerca, happening, note e link. Crea cartelle (anche dentro altre cartelle) a sinistra, poi sposta gli elementi con il menu cartella su ogni scheda. La ricerca in alto guarda tra tutte le tue cose e inventa anche nuove scintille su qualsiasi parola scrivi.',
seed_note2_title:'Una vita psicologicamente ricca',seed_note2_body:'Oishi e Westgate (2022), Psychological Review. Sostengono che una vita piena di esperienze varie, interessanti e capaci di cambiare prospettiva sia un tipo distinto di vita buona, accanto a quella felice e a quella significativa.',
seed_diary_text:'Ho salutato sette persone andando in stazione. Quattro hanno risposto, e un signore anziano mi ha detto che il forno all’angolo il lunedì è chiuso. Mi sono sentito più leggero per tutta la mattina.'
},

m1_t:'Plan des domaines.',m1_b:'Sept domaines sur dix sont tirés, en favorisant ceux que tu as le moins utilisés (la variété ralentit l’adaptation hédonique) et ceux liés au besoin que tu as choisi.',
m2_t:'Synthèse des étincelles.',m2_b:'Chaque domaine a des modèles avec des cases ouvertes (un pays, un genre musical, une couleur, un savoir-faire, une question…) et une variante facultative. Cette grammaire produit {n} étincelles différentes, sans compter les jokers de Claude.',
m3_t:'À ta mesure.',m3_b:'L’énergie, la compagnie et le temps repondèrent les modèles pour que le défi reste dans ta zone idéale, ni ennuyeux ni écrasant.',
m4_t:'Registre de nouveauté.',m4_b:'Chaque étincelle a une empreinte. Les nouvelles semaines écartent les empreintes déjà vues, pour que la boussole pointe toujours ailleurs.',
m5_t:'Passer à l’acte.',m5_b:'Chaque étincelle vient avec un « quand » (une intention de mise en œuvre), et le Journal boucle la boucle par la réflexion.',

seed_note1_title:'Comment fonctionne la Bibliothèque',seed_note1_body:'Tout ce que tu enregistres arrive ici : étincelles issues de la recherche, happenings, notes et liens. Crée des dossiers (et des dossiers dans des dossiers) à gauche, puis déplace les éléments avec le menu dossier de chaque carte. La recherche en haut parcourt toutes tes affaires et invente aussi de nouvelles étincelles sur ce que tu tapes.',

sci_eyebrow:'Por qué funciona',sci_h1:'El azar, con método.',sci_lede:'Get Random parece un juego, pero cada mecanismo viene de la ciencia de la motivación y de la psicología cognitiva. Esto es lo que sostiene cada parte.',in_app:'En la app:',method_h:'Cómo se genera una semana',
m1_t:'Plan de ámbitos.',m1_b:'Se sortean siete de los diez ámbitos, dando más peso a los que menos has usado (la variedad frena la adaptación hedónica) y a la necesidad que hayas elegido.',
m2_t:'Síntesis de chispas.',m2_b:'Cada ámbito tiene plantillas con huecos abiertos (un país, un género musical, un color, una habilidad, una pregunta…) y un giro opcional. Esa gramática produce {n} chispas distintas, sin contar los comodines de Claude.',
m3_t:'A tu medida.',m3_b:'La energía, la compañía y el tiempo vuelven a ponderar las plantillas para que el reto quede en tu zona ideal: ni aburrido ni abrumador.',
m4_t:'Registro de novedad.',m4_b:'Cada chispa tiene una huella. Las semanas nuevas descartan las huellas que ya has visto, así que la brújula siempre apunta a otro sitio.',
m5_t:'Pasar a la acción.',m5_b:'Cada chispa trae un «cuándo» (una intención de implementación) y el Diario cierra el círculo con la reflexión.',
m6_t:'Seis idiomas.',m6_b:'Las chispas se guardan como recetas, no como frases, así que al cambiar de idioma tu semana, tu bandeja y tus happenings se reescriben al instante.',
disclaimer:'Get Random es una herramienta de bienestar y curiosidad, no una terapia ni un consejo médico. Si lo estás pasando mal, habla con alguien de confianza o con un servicio de apoyo de tu zona.',
cl_rate:'Claude necesita un respiro. Inténtalo de nuevo en un minuto.',cl_off:'Las ideas de Claude están desactivadas en esta página.',cl_fail:'Claude no ha podido responder a eso. El generador integrado sigue funcionando.',
seed_note1_title:'Cómo funciona la Biblioteca',seed_note1_body:'Todo lo que guardas llega aquí: chispas de la búsqueda, happenings, notas y enlaces. Crea carpetas (y carpetas dentro de carpetas) a la izquierda y mueve los elementos con el menú de carpeta de cada tarjeta. La búsqueda de arriba mira entre todas tus cosas y además inventa chispas nuevas sobre lo que escribas.',
seed_note2_title:'Una vida psicológicamente rica',seed_note2_body:'Oishi y Westgate (2022), Psychological Review. Defienden que una vida llena de experiencias variadas, interesantes y que cambian la perspectiva es un tipo distinto de buena vida, junto a la vida feliz y la vida con sentido.',
seed_diary_text:'Saludé a siete personas de camino a la estación. Cuatro me devolvieron el saludo, y un señor mayor me contó que la panadería de la esquina cierra los lunes. Me sentí más ligero toda la mañana.'

  const prompt=`You write one "spark" for Get Random, an app that suggests one small novel activity per day, grounded in motivation science (Self-Determination Theory, psychological richness, savoring, awe, weak ties, implementation intentions).

function sanitizeCompact(o){if(!o||!Array.isArray(o.d)||o.d.length!==7)return null;const w=blankWeek(MON);w.name=String(o.n||'').slice(0,80);if(!w.name)w.auto={k:'shared'};w.origin='imported';

let menuOpen=false,activeIdx=0;
function moveInd(animate){const list=$('#langlist');const li=list.querySelectorAll('li')[activeIdx];const ind=list.querySelector('.lang-ind');if(!li||!ind)return;if(!animate)ind.style.transition='none';ind.style.transform=`translateY(${li.offsetTop}px)`;ind.style.height=li.offsetHeight+'px';list.setAttribute('aria-activedescendant',li.id);if(!animate){void ind.offsetWidth;ind.style.transition=''}}
function openMenu(){if(menuOpen)return;menuOpen=true;$('#lang').classList.add('open');$('#langbtn').setAttribute('aria-expanded','true');activeIdx=Math.max(0,ORDER.indexOf(LG));requestAnimationFrame(()=>{moveInd(false);$('#langlist').focus({preventScroll:true})})}
function closeMenu(focusBtn){if(!menuOpen)return;menuOpen=false;$('#lang').classList.remove('open');$('#langbtn').setAttribute('aria-expanded','false');if(focusBtn)$('#langbtn').focus()}
function chooseLang(code){closeMenu(true);if(code===LG)return;S.prefs.lang=code;save();
  const apply=()=>{setLang(code);if(view==='library'&&L.q.trim())L.gen=genForQuery(L.q.trim());renderChrome();render();toast(LANGS[code].native)};
  const m=$('#main');if(reduceMotion()){apply();return}m.classList.add('fade');setTimeout(()=>{apply();requestAnimationFrame(()=>m.classList.remove('fade'))},150)}
function wireLangMenu(){
  const btn=$('#langbtn'),list=$('#langlist'),wrap=$('#lang');
  btn.addEventListener('click',()=>menuOpen?closeMenu(false):openMenu());
  btn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openMenu()}});
  list.addEventListener('keydown',e=>{const n=ORDER.length;
    if(e.key==='ArrowDown'){e.preventDefault();activeIdx=(activeIdx+1)%n;moveInd(true)}
    else if(e.key==='ArrowUp'){e.preventDefault();activeIdx=(activeIdx-1+n)%n;moveInd(true)}
    else if(e.key==='Home'){e.preventDefault();activeIdx=0;moveInd(true)}
    else if(e.key==='End'){e.preventDefault();activeIdx=n-1;moveInd(true)}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseLang(ORDER[activeIdx])}
    else if(e.key==='Escape'){e.preventDefault();closeMenu(true)}
    else if(e.key==='Tab'){closeMenu(false)}
    else if(e.key.length===1){const ch=e.key.toLocaleLowerCase();const start=activeIdx;for(let j=1;j<=n;j++){const c=ORDER[(start+j)%n];if(LANGS[c].native.toLocaleLowerCase().startsWith(ch)||c.startsWith(ch)){activeIdx=(start+j)%n;moveInd(true);break}}}});
  list.addEventListener('pointermove',e=>{const li=e.target.closest('li[data-lang]');if(!li)return;const i=ORDER.indexOf(li.dataset.lang);if(i!==activeIdx){activeIdx=i;moveInd(true)}});
  list.addEventListener('click',e=>{const li=e.target.closest('li[data-lang]');if(li)chooseLang(li.dataset.lang)});
  document.addEventListener('pointerdown',e=>{if(menuOpen&&!wrap.contains(e.target))closeMenu(false)});
  window.addEventListener('resize',()=>{if(menuOpen)moveInd(false)})}

/* drag & drop (pointer: mouse, touch, pen) */
let drag=null;
document.addEventListener('pointerdown',ev=>{
  const g=ev.target.closest('[data-grip]');const card=ev.target.closest('.ev[data-list]');
  if(!card||ev.button!==0)return;if(!g&&(ev.pointerType!=='mouse'||ev.target.closest('button,select,input,textarea,label')))return;
  drag={id:card.dataset.ev,card,x0:ev.clientX,y0:ev.clientY,active:false,pid:ev.pointerId};
  if(g){ev.preventDefault();try{g.setPointerCapture(ev.pointerId)}catch(e){}}});
document.addEventListener('pointermove',ev=>{
  if(!drag||ev.pointerId!==drag.pid)return;
  if(!drag.active){if(Math.hypot(ev.clientX-drag.x0,ev.clientY-drag.y0)<6)return;drag.active=true;const gh=drag.card.cloneNode(true);gh.classList.add('ghost');gh.removeAttribute('data-list');document.body.appendChild(gh);drag.ghost=gh;drag.card.style.opacity='.35';document.body.style.userSelect='none'}
  ev.preventDefault();drag.ghost.style.left=(ev.clientX-30)+'px';drag.ghost.style.top=(ev.clientY-18)+'px';
  const el=document.elementFromPoint(ev.clientX,ev.clientY);const zone=el&&el.closest('[data-drop]');
  document.querySelectorAll('.over').forEach(z=>z!==zone&&z.classList.remove('over'));document.querySelectorAll('.dropmark').forEach(m=>m.remove());
  if(zone){zone.classList.add('over');const cards=[...zone.querySelectorAll(':scope > .ev')].filter(c=>c!==drag.card);let idx=cards.length;for(let i=0;i<cards.length;i++){const r=cards[i].getBoundingClientRect();if(ev.clientY<r.top+r.height/2){idx=i;break}}
    drag.zone=zone.dataset.drop;drag.idx=idx;const mk=document.createElement('div');mk.className='dropmark';zone.insertBefore(mk,cards[idx]||zone.querySelector(':scope > form'))}else drag.zone=null},{passive:false});
function endDrag(){if(!drag)return;const d=drag;drag=null;document.querySelectorAll('.over').forEach(z=>z.classList.remove('over'));document.querySelectorAll('.dropmark').forEach(m=>m.remove());document.body.style.userSelect='';
  if(!d.active)return;d.ghost.remove();d.card.style.opacity='';if(d.zone){const f=findEv(d.id);let idx=d.idx;if(f&&f.key===d.zone&&idx>=f.idx)idx++;moveEv(d.id,d.zone,idx);render();toast(t('toast_moved'))}}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

  genTray(b){const s=(L.gen||[]).concat(L.claude&&L.claude!=='loading'?L.claude:[]).find(x=>x.id===b.dataset.id);S.tray.push({id:uid(),title:genTitle(s),domain:s.domain,min:s.min,twist:null,src:'search'});save();toast(t('toast_sent_tray'))},
  async libClaude(){const q=L.q.trim();L.claude='loading';render();try{const r=await sample.json(`Suggest 4 small, concrete, safe, low-cost activities someone could do this week inspired by "${q}". Each belongs to one domain from: ${DKEYS.join(', ')}. Make them varied and surprising. Write each title in ${T.english}, informal second person. Reply with JSON only: {"sparks":[{"title":"imperative sentence, max 110 chars","domain":"one of the domains","minutes":number}]}`,{cache:false});
    L.claude=(r&&Array.isArray(r.sparks)?r.sparks:[]).slice(0,6).map(s=>({id:uid(),title:String(s.title||'').slice(0,160),domain:DOMAINS[s.domain]?s.domain:'play',min:Math.max(0,Math.min(600,parseInt(s.minutes)||30)),src:'claude'})).filter(s=>s.title);render()}catch(e){L.claude=null;render();claudeErr(e)}},
  foundGo(b,ev){ev.preventDefault();if(b.dataset.wid){S.current=b.dataset.wid;save()}if(b.dataset.iid){L.edit=b.dataset.iid;L.q='';L.gen=null}go(b.dataset.go2)},
  async postWeek(){await postWeek(S.weeks.find(x=>x.id===$('#cw').value),$('#cn').value.trim())},
  async adopt(b){const p=C.posts.find(x=>x.id===b.dataset.id);if(!p)return;const o=p.data||{};const w=sanitizeCompact({n:o.name,d:o.days});if(!w)return;w.origin='commons';S.weeks.unshift(w);save();toast(t('toast_adopted'));try{await db.collection('commons').doc(p.id).update({adopted:(+o.adopted||0)+1})}catch(e){}},
  async unpost(b){if(!confirmArm('up'+b.dataset.id,b))return;try{await db.collection('commons').doc(b.dataset.id).delete();toast(t('toast_removed_commons'))}catch(e){toast(t('toast_remove_fail'))}}
};

/* ================= event wiring ================= */
document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]');if(g){ev.preventDefault();go(g.dataset.go);return}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){if(b.tagName==='A')ev.preventDefault();f(b,ev)}});
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('[data-form]');if(!f)return;ev.preventDefault();const k=f.dataset.form;
  if(k==='add'){const inp=f.querySelector('input');const v=inp.value.trim();if(!v)return;listArr(f.dataset.list).push({id:uid(),title:v.slice(0,200),domain:'play',min:0,twist:null,src:'custom'});save();render();const again=$('#add-'+f.dataset.list);if(again)again.focus()}
  if(k==='diary'){readDiary();if(!D.text.trim()){toast(t('toast_write_first'));return}const [wid,eid]=(D.link||'|').split('|');
    const entry={id:D.id||uid(),date:D.date,text:D.text.trim(),mood:D.mood,energy:D.energy,persp:D.persp,name:D.name,week:wid||null,ev:eid||null,tags:D.tags.split(',').map(s=>s.trim()).filter(Boolean).slice(0,8),created:Date.now()};
    const w=S.weeks.find(x=>x.id===wid);if(w){const e=w.days.flat().find(x=>x.id===eid);if(e)entry.title=evTitle(e)}
    const i=S.diary.findIndex(x=>x.id===entry.id);if(i>-1)S.diary[i]=entry;else S.diary.push(entry);save();D=freshD();render();toast(t('toast_entry_saved'))}
  if(k==='search'){L.q=$('#libq').value;L.claude=null;L.gen=L.q.trim()?genForQuery(L.q.trim()):null;render();const i=$('#libq');if(i)i.focus()}
  if(k==='newfolder'){const n=$('#nf').value.trim();if(!n)return;const f2={id:uid(),name:n.slice(0,60),custom:true,parent:$('#nfp').value||null};S.folders.push(f2);L.newFolder=false;L.folder=f2.id;save();render();toast(t('toast_folder_created'))}
  if(k==='item'){const it=S.items.find(x=>x.id===f.dataset.id);it.title=$('#it-t').value.trim().slice(0,160)||itemView(it).title;it.body=$('#it-b').value.slice(0,20000);it.example=false;delete it.seed;delete it.k;delete it.qk;delete it.hk;save();L.edit=null;render();toast(t('toast_saved'))}});
document.addEventListener('change',ev=>{const x=ev.target;
  if(x.dataset.move){const v=x.value;if(!v)return;const f=findEv(x.dataset.move);if(!f)return;if(v==='up')moveEv(x.dataset.move,f.key,Math.max(0,f.idx-1));else if(v==='down')moveEv(x.dataset.move,f.key,f.idx+2);else moveEv(x.dataset.move,v,null);render();const sel=$('#mv-'+x.dataset.move);if(sel)sel.focus();toast(t('toast_moved'))}
  if(x.dataset.movefolder){const it=S.items.find(i=>i.id===x.dataset.movefolder);it.folder=x.value;save();render();toast(t('toast_moved_to',{f:folderName(S.folders.find(f=>f.id===x.value))}))}
  if(x.dataset.bind==='wkstart'&&x.value){const w=curWeek();w.start=x.value;if(w.auto&&w.auto.k==='week_of')w.auto.d=x.value;save();render()}});
document.addEventListener('input',ev=>{const x=ev.target;if(x.dataset.bind==='dq'){readDiary();dq=x.value;const pos=x.selectionStart;render();const s=$('#dsearch');s.focus();try{s.setSelectionRange(pos,pos)}catch(e){}}});
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(VIEWS.includes(v)&&v!==view){view=v;render();if(v==='commons')subscribeCommons()}});

/* ================= boot ================= */
const stored=loadLocal();
setLang((stored&&stored.prefs&&LANGS[stored.prefs.lang])?stored.prefs.lang:detectLang());
S=normalize(stored||seedState());
S.prefs.lang=LG;save();
applyTS();renderChrome();wireLangMenu();render();
connectServices();
})();

</script>
</body></html>
